# Configuracao do broker Eclipse Mosquitto - TP final de SDA
# Broker local, sem autenticacao (uso didatico em um unico computador).

# Porta MQTT padrao, aceitando conexoes de qualquer interface
listener 1883 0.0.0.0
allow_anonymous true

# Log no console (visivel com: docker logs mosquitto-sda)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
